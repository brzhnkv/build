# Базовые образы JRE для Jib (images/jre-base): собираются здесь, в публичном репозитории, — его Actions не
# тратят минуты частных; раз в неделю пересобираются, чтобы подтянуть обновления безопасности Alpine и JRE
# (CODE_HOST_INDEPENDENCE_DESIGN §7: «базовые образы обновляются реже, чем apk add на каждой сборке»).
name: Базовые образы

on:
  push:
    branches: [ main ]
    paths: [ 'images/**', '.github/workflows/images.yml' ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  jre-base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: '25'
            extra: ''
          - tag: '25-heif'
            extra: 'libheif libheif-tools'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Дата сборки
        run: echo "DAY=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/jre-base
          platforms: linux/amd64,linux/arm64
          build-args: EXTRA_PACKAGES=${{ matrix.extra }}
          push: true
          tags: |
            ghcr.io/brzhnkv/jre-base:${{ matrix.tag }}
            ghcr.io/brzhnkv/jre-base:${{ matrix.tag }}-${{ env.DAY }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
