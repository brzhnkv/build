# Сборка Java-проекта на базе brzhnkv/build: тесты (./gradlew build) и, если задан image, образ в ghcr
# с неизменяемым тегом-sha (никаких :latest). Подключение из проекта:
#
#   jobs:
#     build:
#       uses: brzhnkv/build/.github/workflows/java-build.yml@v1.0.0
#       with: { image: ghcr.io/brzhnkv/notify }
#
# У вызывающего workflow должно быть permissions: packages: write (для образа).
name: Java — сборка

on:
  workflow_call:
    inputs:
      working-directory:
        description: Каталог Gradle-проекта (с gradlew) относительно корня репозитория
        type: string
        default: '.'
      node-version:
        description: Поставить Node.js этой версии (для pre-build, например сборки страницы)
        type: string
        default: ''
      pre-build:
        description: Команда ДО сборки, из корня репозитория (например, cd web && npm ci && npm run build)
        type: string
        default: ''
      post-check:
        description: Проверка ПОСЛЕ сборки, из working-directory (например, ./tools/web-coverage.sh)
        type: string
        default: ''
      image:
        description: Образ без тега (ghcr.io/brzhnkv/<имя>); пусто — только тесты
        type: string
        default: ''
      dockerfile:
        description: Свой Dockerfile (путь от корня репозитория); пусто — общий образ сервиса ниже
        type: string
        default: ''
      builder:
        description: >-
          Чем собирать образ: docker (Dockerfile + buildx — нужен Docker на раннере) или jib (без Docker: и на
          GitHub, и на своём раннере Mac mini; CODE_HOST_INDEPENDENCE_DESIGN §4.2). У jib всё, что делал RUN, —
          в базовом образе (base-image), HEALTHCHECK — в compose проекта.
        type: string
        default: docker
      base-image:
        description: Базовый образ для jib (ghcr.io/brzhnkv/jre-base:25, :25-heif — с libheif)
        type: string
        default: ghcr.io/brzhnkv/jre-base:25
      jvm-flags:
        description: Флаги JVM для jib через запятую (например --enable-preview); память — JAVA_TOOL_OPTIONS базы
        type: string
        default: ''
      push:
        description: Собрать и выложить образ (на PR обычно false)
        type: boolean
        default: true
      runs-on:
        description: >-
          На чём запускать — JSON: "ubuntu-latest" (GitHub) или ["self-hosted", "orchestrator"] (свой раннер
          на Mac mini: минуты Actions не тратятся, 2026-10-11 они кончились к середине месяца)
        type: string
        default: '"ubuntu-latest"'

env:
  # Держать равной версии java в gradle/libs.versions.toml (сверяет ci.yml базы).
  JAVA_VERSION: '25'

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Свой раннер: ~/.gradle и так на диске, а облачный кэш GitHub через домашнюю сеть — минуты (2026-10-11:
          # 169 с восстановления + 39 с сохранения на прогон). На GitHub-раннере кэш нужен.
          # Не «self-hosted && '' || 'gradle'»: пустая строка в выражениях GitHub — ложь, такое всегда даёт gradle (v1.2.1).
          cache: ${{ !contains(inputs.runs-on, 'self-hosted') && 'gradle' || '' }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/**/*.gradle*
            ${{ inputs.working-directory }}/**/gradle-wrapper.properties

      - if: inputs.node-version != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: До сборки
        if: inputs.pre-build != ''
        run: ${{ inputs.pre-build }}

      - name: Тесты и сборка
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew --no-daemon clean build

      - name: Отчёт о тестах при падении
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: ${{ inputs.working-directory }}/build/reports/tests/
          if-no-files-found: ignore

      - name: Проверка после сборки
        if: inputs.post-check != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.post-check }}

      # Общий образ сервиса: исполняемый jar (плагин dev.brzhnkv.service отключает «plain»), свой
      # пользователь, healthcheck по actuator на MANAGEMENT_PORT (или SERVER_PORT) из compose.
      - name: Общий Dockerfile
        if: inputs.image != '' && inputs.push && inputs.builder == 'docker' && inputs.dockerfile == ''
        run: |
          cat > "$RUNNER_TEMP/Dockerfile" <<'DOCKERFILE'
          ARG JAVA
          FROM eclipse-temurin:${JAVA}-jre-alpine
          ENV TZ=UTC \
              JAVA_OPTS="-XX:MaxRAMPercentage=75 -XX:+UseStringDeduplication"
          WORKDIR /opt/app
          RUN apk add --no-cache wget \
              && addgroup -S app && adduser -S -u 10001 -G app app
          COPY build/libs/*.jar /opt/app/app.jar
          USER app
          HEALTHCHECK --interval=10s --timeout=5s --start-period=25s --retries=6 \
              CMD sh -c 'wget -qO- "http://localhost:${MANAGEMENT_PORT:-${SERVER_PORT:-8080}}/actuator/health" > /dev/null || exit 1'
          ENTRYPOINT ["sh", "-c", "exec java $JAVA_OPTS -jar /opt/app/app.jar"]
          DOCKERFILE
          echo "DOCKERFILE_PATH=$RUNNER_TEMP/Dockerfile" >> "$GITHUB_ENV"

      - name: Свой Dockerfile
        if: inputs.image != '' && inputs.push && inputs.builder == 'docker' && inputs.dockerfile != ''
        run: echo "DOCKERFILE_PATH=${{ inputs.dockerfile }}" >> "$GITHUB_ENV"

      - if: inputs.image != '' && inputs.push && inputs.builder == 'docker'
        uses: docker/setup-buildx-action@v3
      - if: inputs.image != '' && inputs.push && inputs.builder == 'docker'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ
        if: inputs.image != '' && inputs.push && inputs.builder == 'docker'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ inputs.image }}:${{ github.sha }}
          build-args: JAVA=${{ env.JAVA_VERSION }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      # Jib: образ без демона Docker, linux/amd64 (платформа Jib по умолчанию), тот же тег-sha. Плагин подключает
      # скрипт инициализации — проекты Jib у себя не объявляют. Настройки и токен — через окружение, не -D: на
      # своём раннере командную строку видят другие процессы.
      - name: Образ (Jib)
        if: inputs.image != '' && inputs.push && inputs.builder == 'jib'
        working-directory: ${{ inputs.working-directory }}
        env:
          JIB_FROM: ${{ inputs.base-image }}
          JIB_TO: ${{ inputs.image }}:${{ github.sha }}
          JIB_USER: ${{ github.actor }}
          JIB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIB_JVM_FLAGS: ${{ inputs.jvm-flags }}
        run: |
          cat > "$RUNNER_TEMP/jib.init.gradle" <<'GRADLE'
          initscript {
              repositories { gradlePluginPortal() }
              dependencies { classpath 'com.google.cloud.tools:jib-gradle-plugin:3.5.4' }
          }
          rootProject {
              apply plugin: com.google.cloud.tools.jib.gradle.JibPlugin
              def env = { String k -> def v = System.getenv(k); v == null || v.isBlank() ? null : v }
              jib {
                  from { image = env('JIB_FROM') }
                  to {
                      image = env('JIB_TO')
                      auth { username = env('JIB_USER'); password = env('JIB_TOKEN') }
                  }
                  container {
                      user = 'app'
                      workingDirectory = '/opt/app'
                      if (env('JIB_JVM_FLAGS')) jvmFlags = env('JIB_JVM_FLAGS').split(',').collect { it.trim() }
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon jib --init-script "$RUNNER_TEMP/jib.init.gradle"
