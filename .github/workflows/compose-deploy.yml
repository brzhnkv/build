# Деплой сервиса на VPS через docker compose: compose-файл → сервер, .env с образом и тегом-sha,
# pull + up, ожидание healthy, проверка «код не старее схемы БД» (Flyway). Секреты сервиса сюда не
# ходят: их раскладывает реестр infra/platform (SOPS) в /opt/platform-secrets/<имя>.env (env_file).
#
# Compose-файл проекта берёт образ так: image: ${IMAGE}:${IMAGE_TAG:?…}
#
#   deploy:
#     needs: build
#     uses: brzhnkv/build/.github/workflows/compose-deploy.yml@v1.0.0
#     with: { image: ghcr.io/brzhnkv/notify, service: notify, server-dir: /opt/notify }
#     secrets: inherit
name: Compose — деплой

on:
  workflow_call:
    inputs:
      image:
        description: Образ без тега (тег — sha коммита, его собрал java-build)
        type: string
        required: true
      service:
        description: Сервис в compose-файле; его имя контейнера — container_name
        type: string
        required: true
      container:
        description: Имя контейнера, если отличается от service
        type: string
        default: ''
      server-dir:
        description: Каталог проекта на сервере (/opt/<имя>)
        type: string
        required: true
      compose-file:
        type: string
        default: docker-compose.prod.yml
      runs-on:
        description: >-
          На чём запускать — JSON: "ubuntu-latest" (GitHub) или ["self-hosted", "orchestrator"] (свой раннер на
          Mac mini, когда кончились минуты Actions; CODE_HOST_INDEPENDENCE_DESIGN §4.3). Проект передаёт сюда
          переменную репозитория CI_RUNNER с запасным '"ubuntu-latest"' (JSON-строка, как у java-build)
        type: string
        default: '"ubuntu-latest"'
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Обычные ssh и rsync, без экшенов: rsync-deployments — docker-экшен, а на своём раннере Docker нет
      # (CODE_HOST_INDEPENDENCE_DESIGN §4.2). Ключ — во временном файле раннера, удаляется в конце задачи.
      - name: Ключ сервера
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          {
            echo "SSH=ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ConnectTimeout=20"
            echo "TARGET=$USER@$HOST"
          } >> "$GITHUB_ENV"

      - name: Compose-файл на сервер
        run: rsync -az -e "$SSH" "${{ inputs.compose-file }}" "$TARGET:${{ inputs.server-dir }}/"

      - name: Деплой
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ github.sha }}
          SERVICE: ${{ inputs.service }}
          CONTAINER: ${{ inputs.container || inputs.service }}
          DIR: ${{ inputs.server-dir }}
          COMPOSE: ${{ inputs.compose-file }}
        run: |
          set -euo pipefail
          # Значения — во входах workflow (не из PR): передаются переменными окружения удалённой оболочке.
          $SSH "$TARGET" "IMAGE=$(printf %q "$IMAGE") TAG=$(printf %q "$TAG") SERVICE=$(printf %q "$SERVICE") CONTAINER=$(printf %q "$CONTAINER") DIR=$(printf %q "$DIR") COMPOSE=$(printf %q "$COMPOSE") bash -s" <<'SCRIPT'
          set -euo pipefail
          cd "$DIR"

          # .env — только образ и его тег (секреты — env_file из реестра платформы).
          printf 'IMAGE=%s\nIMAGE_TAG=%s\n' "$IMAGE" "$TAG" > .env
          chmod 600 .env

          docker compose -f "$COMPOSE" pull "$SERVICE"
          docker compose -f "$COMPOSE" up -d --remove-orphans

          echo "Ожидаю готовности $CONTAINER…"
          for i in $(seq 1 45); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "✓ healthy ($i)"; break; fi
            echo "  $i: $status"; sleep 3
          done
          [ "$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER")" = "healthy" ] \
            || { echo "✗ health-check не прошёл"; docker logs --tail 60 "$CONTAINER"; exit 1; }

          # Код не должен быть старее схемы БД (Flyway) — ловим и валим деплой.
          if docker logs "$CONTAINER" 2>&1 | grep -c 'newer than the latest available migration' >/dev/null; then
            echo "✗ сервис старее схемы БД"; exit 1
          fi
          echo "✓ deploy complete"
          docker image prune -af --filter "until=168h" 2>/dev/null || true
          SCRIPT

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
