# Деплой сервиса на VPS через шлюз ключей деплоя (infra ops/deploy/gate.py): compose-файл → приёмный каталог
# проекта, затем `deploy <сервис>=<sha>`. Каталог, образ, контейнер, ожидание healthy и Flyway-страж — на стороне
# шлюза (infra ops/deploy/projects.yaml): ключ проекта ничего другого на сервере сделать не может, compose
# шлюз проверяет перед выкаткой. Секреты сюда не ходят — их раскладывает реестр infra/platform (SOPS).
#
#   deploy:
#     needs: build
#     uses: brzhnkv/build/.github/workflows/compose-deploy.yml@v1.5.0
#     with: { service: notify, runs-on: '${{ vars.DEPLOY_RUNNER || '"ubuntu-latest"' }}' }
#     secrets: inherit
name: Compose — деплой

on:
  workflow_call:
    inputs:
      service:
        description: Сервис проекта в infra ops/deploy/projects.yaml (тег — sha этого коммита, его собрал java-build)
        type: string
        required: true
      compose-file:
        type: string
        default: docker-compose.prod.yml
      runs-on:
        description: >-
          На чём запускать — JSON: "ubuntu-latest" (GitHub) или ["self-hosted", "orchestrator"] (свой раннер на
          Mac mini, когда кончились минуты Actions; CODE_HOST_INDEPENDENCE_DESIGN §4.3). Проект передаёт сюда
          переменную репозитория CI_RUNNER с запасным '"ubuntu-latest"' (JSON-строка, как у java-build)
        type: string
        default: '"ubuntu-latest"'
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Обычные ssh и rsync, без экшенов: rsync-deployments — docker-экшен, а на своём раннере Docker нет
      # (CODE_HOST_INDEPENDENCE_DESIGN §4.2). Ключ — во временном файле раннера, удаляется в конце задачи.
      - name: Ключ сервера
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          {
            echo "SSH=ssh -i $RUNNER_TEMP/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ConnectTimeout=20"
            echo "TARGET=$USER@$HOST"
          } >> "$GITHUB_ENV"

      # Ключ проекта на сервере — forced command шлюза: rsync кладёт файл в его приёмный каталог (путь — `:`,
      # не /opt/<проект>), `deploy` выкатывает. Залитый compose шлюз проверяет и применяет целиком (up --remove-orphans).
      - name: Compose-файл на сервер
        run: rsync -az -e "$SSH" "${{ inputs.compose-file }}" "$TARGET:"

      - name: Деплой
        run: $SSH "$TARGET" "deploy ${{ inputs.service }}=${{ github.sha }}"

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
